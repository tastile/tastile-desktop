name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

# Minimal default permissions. Each job tightens further if it needs more.
permissions:
  contents: read

# Cancel in-flight runs for the same ref so a fast-follow push doesn't
# waste a runner on an obsolete SHA. Tag pushes are excluded by the
# condition above; release.yml owns its own concurrency group.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Run loader unit tests
        run: bun test scripts/sops-decrypt.test.ts

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            src/TastileDesktop/TastileDesktop.csproj
            tests/TastileDesktop.Tests/TastileDesktop.Tests.csproj

      - name: Run unit tests
        shell: pwsh
        run: .\scripts\check.ps1 -SkipDesktopBuild

  desktop-build:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-latest
    steps:
      - name: Checkout desktop repo
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout core repo at sibling path
        uses: actions/checkout@v4
        with:
          repository: tastile/tastile-core
          token: ${{ secrets.CORE_REPO_READ_TOKEN }}
          path: .deps/tastile-core
          persist-credentials: false

      - name: Create sibling junction for core path compatibility
        shell: pwsh
        run: |
          New-Item -ItemType Junction -Path "$env:GITHUB_WORKSPACE\..\tastile-core" -Target "$env:GITHUB_WORKSPACE\.deps\tastile-core" -Force | Out-Null

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            src/TastileDesktop/TastileDesktop.csproj
            tests/TastileDesktop.Tests/TastileDesktop.Tests.csproj

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build desktop application
        shell: pwsh
        run: .\scripts\check.ps1
