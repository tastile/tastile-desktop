name: sops-decrypt
on:
  workflow_call:
    inputs:
      env:
        type: string
        required: true
    secrets:
      aws_role_to_assume:
        required: true

permissions:
  id-token: write
  contents: read

jobs:
  decrypt:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Validate environment
        shell: bash
        env:
          TASTILE_ENV: ${{ inputs.env }}
        run: |
          case "$TASTILE_ENV" in
            development|staging|production) ;;
            *) echo "Unsupported environment: $TASTILE_ENV" >&2; exit 2 ;;
          esac

      - name: Assume AWS role
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.aws_role_to_assume }}
          aws-region: ap-northeast-1

      - name: Install sops
        env:
          SOPS_VERSION: v3.9.0
        run: |
          set -euo pipefail
          asset="sops-${SOPS_VERSION}.linux.amd64"
          curl -fsSL -o "/tmp/${asset}" "https://github.com/getsops/sops/releases/download/${SOPS_VERSION}/${asset}"
          curl -fsSL -o /tmp/sops.checksums.txt "https://github.com/getsops/sops/releases/download/${SOPS_VERSION}/sops-${SOPS_VERSION}.checksums.txt"
          cd /tmp
          grep "  ${asset}$" sops.checksums.txt | sha256sum -c -
          sudo mv "/tmp/${asset}" /usr/local/bin/sops
          sudo chmod +x /usr/local/bin/sops
          sops --version

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Run loader
        env:
          TASTILE_ENV: ${{ inputs.env }}
        run: bun run scripts/sops-decrypt.ts --env=${{ inputs.env }}

      - name: Upload decrypted .env
        uses: actions/upload-artifact@v7
        with:
          name: env-${{ inputs.env }}
          path: |
            .env
            .env.development
            .env.dev
            .env.staging
            .env.production
            .env.product
          retention-days: 1
          if-no-files-found: error

  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7

      - name: Validate environment
        shell: bash
        env:
          TASTILE_ENV: ${{ inputs.env }}
        run: |
          case "$TASTILE_ENV" in
            development|staging|production) ;;
            *) echo "Unsupported environment: $TASTILE_ENV" >&2; exit 2 ;;
          esac

      - name: Assume AWS role
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.aws_role_to_assume }}
          aws-region: ap-northeast-1

      - name: Install sops
        env:
          SOPS_VERSION: v3.9.0
        run: |
          set -euo pipefail
          asset="sops-${SOPS_VERSION}.linux.amd64"
          curl -fsSL -o "/tmp/${asset}" "https://github.com/getsops/sops/releases/download/${SOPS_VERSION}/${asset}"
          curl -fsSL -o /tmp/sops.checksums.txt "https://github.com/getsops/sops/releases/download/${SOPS_VERSION}/sops-${SOPS_VERSION}.checksums.txt"
          cd /tmp
          grep "  ${asset}$" sops.checksums.txt | sha256sum -c -
          sudo mv "/tmp/${asset}" /usr/local/bin/sops
          sudo chmod +x /usr/local/bin/sops
          sops --version

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Verify decryptability (no plaintext artifact)
        env:
          TASTILE_ENV: ${{ inputs.env }}
        run: bun run scripts/sops-decrypt.ts --env=${{ inputs.env }} --check
