name: Migrate desktop production secrets to Infisical

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type IMPORT to compare and import the existing production values.
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  migrate:
    if: inputs.confirm == 'IMPORT'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      INFISICAL_DOMAIN: ${{ vars.INFISICAL_DOMAIN }}
      INFISICAL_PROJECT_ID: ${{ vars.INFISICAL_PROJECT_ID_PROD }}
      INFISICAL_IDENTITY_ID: ${{ vars.INFISICAL_IDENTITY_ID_PROD }}
      DOWNLOAD_PUBLIC_BASE_URL: ${{ secrets.DOWNLOAD_PUBLIC_BASE_URL }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
      CLOUDFLARE_R2_BUCKET: ${{ secrets.CLOUDFLARE_R2_BUCKET }}
      CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pinned Infisical CLI
        run: npm install --global @infisical/cli@0.43.134

      - name: Authenticate with GitHub OIDC
        shell: bash
        run: |
          set -euo pipefail
          test -n "$INFISICAL_DOMAIN"
          test -n "$INFISICAL_PROJECT_ID"
          test -n "$INFISICAL_IDENTITY_ID"
          OIDC_JWT="$(curl --fail --silent --show-error \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https%3A%2F%2Fgithub.com%2Ftastile" \
            | jq -er '.value')"
          if ! INFISICAL_TOKEN="$(infisical login \
            --method=oidc-auth \
            --machine-identity-id "$INFISICAL_IDENTITY_ID" \
            --jwt "$OIDC_JWT" \
            --plain --silent --domain "$INFISICAL_DOMAIN")"; then
            echo "Infisical OIDC authentication failed." >&2
            exit 1
          fi
          unset OIDC_JWT
          test -n "$INFISICAL_TOKEN"
          echo "::add-mask::${INFISICAL_TOKEN}"
          echo "INFISICAL_TOKEN=${INFISICAL_TOKEN}" >> "$GITHUB_ENV"
          unset INFISICAL_TOKEN

      - name: Compare and import missing production values
        shell: bash
        run: |
          set -euo pipefail
          names=(
            DOWNLOAD_PUBLIC_BASE_URL
            CLOUDFLARE_ACCOUNT_ID
            CLOUDFLARE_R2_ACCESS_KEY_ID
            CLOUDFLARE_R2_BUCKET
            CLOUDFLARE_R2_SECRET_ACCESS_KEY
          )
          for name in "${names[@]}"; do
            if [[ -z "${!name}" ]]; then
              echo "Required existing GitHub environment secret is missing: ${name}" >&2
              exit 2
            fi
          done

          temp_dir="$(mktemp -d)"
          chmod 0700 "$temp_dir"
          cleanup() { rm -rf -- "$temp_dir"; }
          trap cleanup EXIT

          infisical export --domain "$INFISICAL_DOMAIN" \
            --projectId "$INFISICAL_PROJECT_ID" --env=prod \
            --path=/tastile/desktop --format=json --token "$INFISICAL_TOKEN" \
            --output-file "$temp_dir/before.json" >/dev/null

          node --input-type=module - "$temp_dir/before.json" "$temp_dir/missing.txt" <<'NODE'
          import fs from 'node:fs';
          const [sourcePath, missingPath] = process.argv.slice(2);
          const entries = JSON.parse(fs.readFileSync(sourcePath, 'utf8'));
          const existing = new Map(entries.map(({ key, value }) => [key, value]));
          const names = [
            'DOWNLOAD_PUBLIC_BASE_URL',
            'CLOUDFLARE_ACCOUNT_ID',
            'CLOUDFLARE_R2_ACCESS_KEY_ID',
            'CLOUDFLARE_R2_BUCKET',
            'CLOUDFLARE_R2_SECRET_ACCESS_KEY',
          ];
          const missing = [];
          for (const name of names) {
            if (existing.has(name) && existing.get(name) !== process.env[name]) {
              process.stderr.write(`Infisical already has a different value for ${name}; no imports were made.\n`);
              process.exit(3);
            }
            if (!existing.has(name)) missing.push(name);
          }
          fs.writeFileSync(missingPath, `${missing.join('\n')}${missing.length ? '\n' : ''}`, { mode: 0o600 });
          NODE

          while IFS= read -r name; do
            [[ -n "$name" ]] || continue
            value_file="$temp_dir/$name.value"
            printf '%s' "${!name}" > "$value_file"
            chmod 0600 "$value_file"
            infisical secrets set "${name}=@${value_file}" \
              --domain "$INFISICAL_DOMAIN" --projectId "$INFISICAL_PROJECT_ID" \
              --env=prod --path=/tastile/desktop --token "$INFISICAL_TOKEN" \
              --silent >/dev/null
          done < "$temp_dir/missing.txt"

          infisical export --domain "$INFISICAL_DOMAIN" \
            --projectId "$INFISICAL_PROJECT_ID" --env=prod \
            --path=/tastile/desktop --format=json --token "$INFISICAL_TOKEN" \
            --output-file "$temp_dir/after.json" >/dev/null
          node --input-type=module - "$temp_dir/after.json" <<'NODE'
          import fs from 'node:fs';
          const sourcePath = process.argv[2];
          const entries = JSON.parse(fs.readFileSync(sourcePath, 'utf8'));
          const actual = new Map(entries.map(({ key, value }) => [key, value]));
          const names = [
            'DOWNLOAD_PUBLIC_BASE_URL',
            'CLOUDFLARE_ACCOUNT_ID',
            'CLOUDFLARE_R2_ACCESS_KEY_ID',
            'CLOUDFLARE_R2_BUCKET',
            'CLOUDFLARE_R2_SECRET_ACCESS_KEY',
          ];
          for (const name of names) {
            if (actual.get(name) !== process.env[name]) {
              process.stderr.write(`Infisical value verification failed for ${name}.\n`);
              process.exit(4);
            }
          }
          process.stdout.write(`Verified ${names.length} production values without printing them.\n`);
          NODE

      - name: Verify production OIDC secret fetch
        uses: ./.github/actions/infisical-secrets
        with:
          domain: ${{ vars.INFISICAL_DOMAIN }}
          project-id: ${{ vars.INFISICAL_PROJECT_ID_PROD }}
          identity-id: ${{ vars.INFISICAL_IDENTITY_ID_PROD }}
          environment: prod
          path: /tastile/desktop

      - name: Verify fetched release values
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DOWNLOAD_PUBLIC_BASE_URL"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_R2_ACCESS_KEY_ID"
          test -n "$CLOUDFLARE_R2_BUCKET"
          test -n "$CLOUDFLARE_R2_SECRET_ACCESS_KEY"
          echo "OIDC fetch exposed all required production keys; values were not printed."
