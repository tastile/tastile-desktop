name: Publish update manifest

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Target platform channel"
        required: true
        default: "desktop"
        type: choice
        options:
          - desktop
          - android
          - ios
          - mac
          - web
      latest_version:
        description: "Latest app version (e.g. 0.2.0)"
        required: true
        type: string
      download_url:
        description: "Installer or package URL"
        required: true
        type: string
      notes:
        description: "Release notes shown in update toast"
        required: false
        type: string
      storage_path:
        description: "Optional override path (default: updates/<platform>/manifest.json)"
        required: false
        default: ""
        type: string
      app_storage_path:
        description: "Optional app binary path (default: <platform>/tastile-<platform>-<version>.exe)"
        required: false
        default: ""
        type: string

jobs:
  verify-desktop-core-build:
    runs-on: windows-latest
    steps:
      - name: Checkout desktop repo
        uses: actions/checkout@v4

      - name: Provide monorepo-level app icon for build
        shell: pwsh
        run: |
          Copy-Item "$env:GITHUB_WORKSPACE\src\TastileDesktop\Assets\tastile.ico" "$env:GITHUB_WORKSPACE\..\tastile-icon.ico" -Force

      - name: Checkout core repo at sibling path
        uses: actions/checkout@v4
        with:
          repository: tastile/tastile-core
          token: ${{ secrets.CORE_REPO_READ_TOKEN }}
          path: .deps/tastile-core

      - name: Create sibling junction for core path compatibility
        shell: pwsh
        run: |
          New-Item -ItemType Junction -Path "$env:GITHUB_WORKSPACE\..\tastile-core" -Target "$env:GITHUB_WORKSPACE\.deps\tastile-core" -Force | Out-Null

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Prebuild daemon for copy inclusion
        shell: pwsh
        run: |
          cargo build -p tastile-daemon --release
        working-directory: ${{ github.workspace }}\..\tastile-core

      - name: Verify desktop+core relative path build
        shell: pwsh
        run: |
          dotnet build "src\TastileDesktop\TastileDesktop.csproj" `
            -c Release `
            -p:AppxPackage=false `
            -p:WindowsPackageType=None

  publish-manifest:
    needs: verify-desktop-core-build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required secrets
        run: |
          test -n "${{ secrets.SUPABASE_URL }}" || (echo "Missing SUPABASE_URL" && exit 1)
          test -n "${{ secrets.SUPABASE_SECRET_KEY }}" || (echo "Missing SUPABASE_SECRET_KEY" && exit 1)
          test -n "${{ secrets.SUPABASE_UPDATE_BUCKET }}" || (echo "Missing SUPABASE_UPDATE_BUCKET" && exit 1)

      - name: Resolve storage paths
        id: resolve-paths
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.storage_path }}" ]; then
            manifest_path="${{ github.event.inputs.storage_path }}"
          else
            manifest_path="updates/${{ github.event.inputs.platform }}/manifest.json"
          fi
          if [ -n "${{ github.event.inputs.app_storage_path }}" ]; then
            app_path="${{ github.event.inputs.app_storage_path }}"
          else
            app_path="${{ github.event.inputs.platform }}/tastile-${{ github.event.inputs.platform }}-${{ github.event.inputs.latest_version }}.exe"
          fi
          app_public_url="${{ secrets.SUPABASE_URL }}/storage/v1/object/public/${{ secrets.SUPABASE_UPDATE_BUCKET }}/${app_path}"
          echo "manifest_path=$manifest_path" >> "$GITHUB_OUTPUT"
          echo "app_path=$app_path" >> "$GITHUB_OUTPUT"
          echo "app_public_url=$app_public_url" >> "$GITHUB_OUTPUT"

      - name: Download app binary from source URL
        shell: bash
        run: |
          mkdir -p dist/update
          curl -fsSL "${{ github.event.inputs.download_url }}" -o dist/update/app.bin

      - name: Upload app binary to Supabase Storage
        shell: bash
        run: |
          curl -fsS -X POST \
            "${{ secrets.SUPABASE_URL }}/storage/v1/object/${{ secrets.SUPABASE_UPDATE_BUCKET }}/${{ steps.resolve-paths.outputs.app_path }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SECRET_KEY }}" \
            -H "apikey: ${{ secrets.SUPABASE_SECRET_KEY }}" \
            -H "Content-Type: application/octet-stream" \
            -H "x-upsert: true" \
            --data-binary @dist/update/app.bin

      - name: Build manifest.json
        shell: bash
        run: |
          cat > dist/update/manifest.json <<'JSON'
          {
            "latest_version": "${{ github.event.inputs.latest_version }}",
            "download_url": "${{ steps.resolve-paths.outputs.app_public_url }}",
            "notes": "${{ github.event.inputs.notes }}"
          }
          JSON

      - name: Upload manifest to Supabase Storage
        shell: bash
        run: |
          curl -fsS -X POST \
            "${{ secrets.SUPABASE_URL }}/storage/v1/object/${{ secrets.SUPABASE_UPDATE_BUCKET }}/${{ steps.resolve-paths.outputs.manifest_path }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SECRET_KEY }}" \
            -H "apikey: ${{ secrets.SUPABASE_SECRET_KEY }}" \
            -H "Content-Type: application/json" \
            -H "x-upsert: true" \
            --data-binary @dist/update/manifest.json

      - name: Print public manifest URL
        shell: bash
        run: |
          echo "App URL:"
          echo "${{ steps.resolve-paths.outputs.app_public_url }}"
          echo "Manifest URL:"
          echo "${{ secrets.SUPABASE_URL }}/storage/v1/object/public/${{ secrets.SUPABASE_UPDATE_BUCKET }}/${{ steps.resolve-paths.outputs.manifest_path }}"
