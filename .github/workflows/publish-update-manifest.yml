name: Publish update manifest

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      platform:
        description: "Target platform channel"
        required: true
        default: "desktop"
        type: choice
        options:
          - desktop
          - android
          - ios
          - mac
          - web
      latest_version:
        description: "Latest app version (e.g. 0.2.0)"
        required: true
        type: string
      notes:
        description: "Release notes shown in update toast"
        required: false
        type: string
      storage_path:
        description: "Optional override path (default: updates/<platform>/manifest.json)"
        required: false
        default: ""
        type: string
      app_storage_path:
        description: "Optional app binary path (default: <platform>/tastile-<platform>-<version>.exe)"
        required: false
        default: ""
        type: string

permissions:
  contents: write

jobs:
  build-desktop-installer:
    runs-on: windows-latest
    outputs:
      app_version: ${{ steps.version.outputs.version }}
      installer_name: ${{ steps.installer.outputs.installer_name }}
      installer_path: ${{ steps.installer.outputs.installer_path }}
    steps:
      - name: Checkout desktop repo
        uses: actions/checkout@v4

      - name: Checkout core repo at sibling path
        uses: actions/checkout@v4
        with:
          repository: tastile/tastile-core
          token: ${{ secrets.CORE_REPO_READ_TOKEN }}
          path: .deps/tastile-core

      - name: Create sibling junction for core path compatibility
        shell: pwsh
        run: |
          New-Item -ItemType Junction -Path "$env:GITHUB_WORKSPACE\..\tastile-core" -Target "$env:GITHUB_WORKSPACE\.deps\tastile-core" -Force | Out-Null

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress

      - name: Resolve release version
        id: version
        shell: pwsh
        run: |
          $version = "${{ github.event_name == 'workflow_dispatch' && github.event.inputs.latest_version || github.event.release.tag_name || '' }}"

          $version = $version.Trim()
          if ($version.StartsWith("v", [System.StringComparison]::OrdinalIgnoreCase)) {
            $version = $version.Substring(1)
          }

          if ([string]::IsNullOrWhiteSpace($version)) {
            throw "Unable to resolve a release version from workflow inputs or release metadata."
          }

          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Build desktop installer
        id: installer
        shell: pwsh
        run: |
          .\scripts\build-desktop-installer.ps1 -Version "${{ steps.version.outputs.version }}"
          $name = "tastile-desktop-${{ steps.version.outputs.version }}-setup.exe"
          $path = "artifacts\installer\$name"
          if (!(Test-Path $path)) { throw "Installer not found: $path" }
          "installer_name=$name" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "installer_path=$path" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-installer
          path: ${{ steps.installer.outputs.installer_path }}
          if-no-files-found: error

      - name: Attach installer to GitHub Release
        if: github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            "${{ steps.installer.outputs.installer_path }}" \
            --repo "${{ github.repository }}" \
            --clobber

  publish-manifest:
    needs: build-desktop-installer
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download installer artifact
        uses: actions/download-artifact@v4
        with:
          name: desktop-installer
          path: dist/update

      - name: Validate required secrets
        run: |
          test -n "${{ secrets.SUPABASE_URL }}" || (echo "Missing SUPABASE_URL" && exit 1)
          test -n "${{ secrets.SUPABASE_SECRET_KEY }}" || (echo "Missing SUPABASE_SECRET_KEY" && exit 1)
          test -n "${{ secrets.SUPABASE_UPDATE_BUCKET }}" || (echo "Missing SUPABASE_UPDATE_BUCKET" && exit 1)

      - name: Resolve storage paths
        id: resolve-paths
        shell: bash
        env:
          INPUT_PLATFORM: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.platform || 'desktop' }}
          INPUT_STORAGE_PATH: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.storage_path || '' }}
          INPUT_APP_STORAGE_PATH: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.app_storage_path || '' }}
        run: |
          if [ -n "$INPUT_STORAGE_PATH" ]; then
            manifest_path="$INPUT_STORAGE_PATH"
          else
            manifest_path="updates/$INPUT_PLATFORM/manifest.json"
          fi
          if [ -n "$INPUT_APP_STORAGE_PATH" ]; then
            app_path="$INPUT_APP_STORAGE_PATH"
          else
            app_path="$INPUT_PLATFORM/${{ needs.build-desktop-installer.outputs.installer_name }}"
          fi
          app_public_url="${{ secrets.SUPABASE_URL }}/storage/v1/object/public/${{ secrets.SUPABASE_UPDATE_BUCKET }}/${app_path}"
          echo "manifest_path=$manifest_path" >> "$GITHUB_OUTPUT"
          echo "app_path=$app_path" >> "$GITHUB_OUTPUT"
          echo "app_public_url=$app_public_url" >> "$GITHUB_OUTPUT"

      - name: Upload app binary to Supabase Storage
        shell: bash
        run: |
          installer_path="dist/update/${{ needs.build-desktop-installer.outputs.installer_name }}"
          test -f "$installer_path" || (echo "Installer artifact missing: $installer_path" && exit 1)
          curl -fsS -X POST \
            "${{ secrets.SUPABASE_URL }}/storage/v1/object/${{ secrets.SUPABASE_UPDATE_BUCKET }}/${{ steps.resolve-paths.outputs.app_path }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SECRET_KEY }}" \
            -H "apikey: ${{ secrets.SUPABASE_SECRET_KEY }}" \
            -H "Content-Type: application/octet-stream" \
            -H "x-upsert: true" \
            --data-binary @"$installer_path"

      - name: Build manifest.json
        shell: bash
        env:
          UPDATE_VERSION: ${{ needs.build-desktop-installer.outputs.app_version }}
          UPDATE_NOTES: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.notes || '' }}
          RELEASE_NOTES: ${{ github.event.release.body || '' }}
          UPDATE_DOWNLOAD_URL: ${{ steps.resolve-paths.outputs.app_public_url }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          version = os.environ.get("UPDATE_VERSION", "").strip()
          if version.lower().startswith("v"):
              version = version[1:]

          notes = os.environ.get("UPDATE_NOTES", "").strip()
          if not notes:
              notes = os.environ.get("RELEASE_NOTES", "").strip()

          manifest = {
              "latest_version": version,
              "download_url": os.environ["UPDATE_DOWNLOAD_URL"],
              "notes": notes,
          }
          Path("dist/update/manifest.json").write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload manifest to Supabase Storage
        shell: bash
        run: |
          curl -fsS -X POST \
            "${{ secrets.SUPABASE_URL }}/storage/v1/object/${{ secrets.SUPABASE_UPDATE_BUCKET }}/${{ steps.resolve-paths.outputs.manifest_path }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SECRET_KEY }}" \
            -H "apikey: ${{ secrets.SUPABASE_SECRET_KEY }}" \
            -H "Content-Type: application/json" \
            -H "x-upsert: true" \
            --data-binary @dist/update/manifest.json

      - name: Print public manifest URL
        shell: bash
        run: |
          echo "App URL:"
          echo "${{ steps.resolve-paths.outputs.app_public_url }}"
          echo "Manifest URL:"
          echo "${{ secrets.SUPABASE_URL }}/storage/v1/object/public/${{ secrets.SUPABASE_UPDATE_BUCKET }}/${{ steps.resolve-paths.outputs.manifest_path }}"
