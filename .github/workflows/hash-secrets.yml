name: Hash desktop production secrets

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  hash:
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DOWNLOAD_PUBLIC_BASE_URL: ${{ secrets.DOWNLOAD_PUBLIC_BASE_URL }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
      CLOUDFLARE_R2_BUCKET: ${{ secrets.CLOUDFLARE_R2_BUCKET }}
      CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
    steps:
      - name: Print sha256 of each production secret
        shell: bash
        run: |
          set -euo pipefail
          for name in \
            DOWNLOAD_PUBLIC_BASE_URL \
            CLOUDFLARE_ACCOUNT_ID \
            CLOUDFLARE_R2_ACCESS_KEY_ID \
            CLOUDFLARE_R2_BUCKET \
            CLOUDFLARE_R2_SECRET_ACCESS_KEY; do
            value="${!name}"
            if [[ -z "$value" ]]; then
              echo "${name}: <missing>"
              continue
            fi
            echo "${name}: $(printf '%s' "$value" | sha256sum | awk '{print $1}')"
          done
