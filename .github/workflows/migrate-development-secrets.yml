name: Migrate desktop development secrets to Infisical

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type IMPORT to compare and import the existing repository secret.
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  migrate:
    if: inputs.confirm == 'IMPORT'
    environment: development
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      INFISICAL_DOMAIN: ${{ vars.INFISICAL_DOMAIN }}
      INFISICAL_PROJECT_ID: ${{ vars.INFISICAL_PROJECT_ID_DEV }}
      INFISICAL_IDENTITY_ID: ${{ vars.INFISICAL_IDENTITY_ID_DEV }}
      CORE_REPO_READ_TOKEN: ${{ secrets.CORE_REPO_READ_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pinned Infisical CLI
        run: npm install --global @infisical/cli@0.43.134

      - name: Authenticate with GitHub OIDC
        shell: bash
        run: |
          set -euo pipefail
          test -n "$INFISICAL_DOMAIN"
          test -n "$INFISICAL_PROJECT_ID"
          test -n "$INFISICAL_IDENTITY_ID"
          OIDC_JWT="$(curl --fail --silent --show-error \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https%3A%2F%2Fgithub.com%2Ftastile" \
            | jq -er '.value')"
          if ! INFISICAL_TOKEN="$(infisical login \
            --method=oidc-auth \
            --machine-identity-id "$INFISICAL_IDENTITY_ID" \
            --jwt "$OIDC_JWT" \
            --plain --silent --domain "$INFISICAL_DOMAIN")"; then
            echo "Infisical OIDC authentication failed." >&2
            exit 1
          fi
          unset OIDC_JWT
          test -n "$INFISICAL_TOKEN"
          echo "::add-mask::${INFISICAL_TOKEN}"
          echo "INFISICAL_TOKEN=${INFISICAL_TOKEN}" >> "$GITHUB_ENV"
          unset INFISICAL_TOKEN

      - name: Compare and import the existing core checkout token
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CORE_REPO_READ_TOKEN" || {
            echo "Required existing GitHub repository secret is missing: CORE_REPO_READ_TOKEN" >&2
            exit 2
          }
          temp_dir="$(mktemp -d)"
          chmod 0700 "$temp_dir"
          cleanup() { rm -rf -- "$temp_dir"; }
          trap cleanup EXIT
          target="$temp_dir/current.json"
          node - "$temp_dir/source.token" <<'NODE'
          const fs = require('node:fs');
          fs.writeFileSync(process.argv[2], process.env.CORE_REPO_READ_TOKEN, { mode: 0o600 });
          NODE
          infisical export --domain "$INFISICAL_DOMAIN" \
            --projectId "$INFISICAL_PROJECT_ID" --env=dev \
            --path=/tastile/desktop --format=json --token "$INFISICAL_TOKEN" \
            --output-file "$target" >/dev/null
          node - "$target" <<'NODE'
          const fs = require('node:fs');
          const targetPath = process.argv[2];
          const target = JSON.parse(fs.readFileSync(targetPath, 'utf8'));
          const current = target.find((entry) => entry.key === 'CORE_REPO_READ_TOKEN');
          const expected = process.env.CORE_REPO_READ_TOKEN;
          if (current && current.value !== expected) {
            console.error('Infisical already contains a different CORE_REPO_READ_TOKEN; refusing to overwrite it.');
            process.exit(3);
          }
          fs.writeFileSync(`${targetPath}.needs-import`, current ? 'no' : 'yes', { mode: 0o600 });
          NODE
          if [[ "$(cat "$target.needs-import")" == yes ]]; then
            infisical secrets set "CORE_REPO_READ_TOKEN=@$temp_dir/source.token" \
              --domain "$INFISICAL_DOMAIN" --projectId "$INFISICAL_PROJECT_ID" \
              --env=dev --path=/tastile/desktop --token "$INFISICAL_TOKEN" --silent >/dev/null
          fi
          infisical export --domain "$INFISICAL_DOMAIN" \
            --projectId "$INFISICAL_PROJECT_ID" --env=dev \
            --path=/tastile/desktop --format=json --token "$INFISICAL_TOKEN" \
            --output-file "$target" >/dev/null
          node - "$target" <<'NODE'
          const fs = require('node:fs');
          const targetPath = process.argv[2];
          const target = JSON.parse(fs.readFileSync(targetPath, 'utf8'));
          const actual = target.find((entry) => entry.key === 'CORE_REPO_READ_TOKEN')?.value;
          if (actual !== process.env.CORE_REPO_READ_TOKEN) {
            console.error('Infisical verification failed for CORE_REPO_READ_TOKEN.');
            process.exit(4);
          }
          console.log('CORE_REPO_READ_TOKEN imported and verified without displaying its value.');
          NODE

      - name: Verify GitHub OIDC read access
        uses: ./.github/actions/infisical-secrets
        with:
          domain: ${{ vars.INFISICAL_DOMAIN }}
          project-id: ${{ vars.INFISICAL_PROJECT_ID_DEV }}
          identity-id: ${{ vars.INFISICAL_IDENTITY_ID_DEV }}
          environment: dev
          path: /tastile/desktop
      - name: Verify required token is available through OIDC
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CORE_REPO_READ_TOKEN"
          echo "GitHub OIDC can retrieve CORE_REPO_READ_TOKEN from Infisical."
