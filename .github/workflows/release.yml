name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 0.3.10.0)"
        required: true
        type: string

permissions:
  id-token: write
  contents: write

# A single ref may only have one in-flight release build; second
# dispatches (e.g. re-running a failed release) wait in line.
concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-installer:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      installer_name: ${{ steps.installer.outputs.installer_name }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Resolve version
        id: version
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if ($env:EVENT_NAME -eq "workflow_dispatch") {
            $version = $env:INPUT_VERSION.TrimStart("v")
          } else {
            $version = $env:REF_NAME.TrimStart("v")
          }
          if ($version -notmatch '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$') {
            throw "Release version must contain exactly four ASCII numeric components."
          }
          foreach ($component in $version.Split(".")) {
            $parsedComponent = 0
            if ((![int]::TryParse($component, [ref]$parsedComponent)) -or $parsedComponent -gt 65535) {
              throw "Each release version component must be between 0 and 65535."
            }
          }

          [xml]$project = Get-Content -Raw -Path "src\TastileDesktop\TastileDesktop.csproj"
          $projectVersion = [string]($project.Project.PropertyGroup.Version | Select-Object -First 1)
          if ($version -ne $projectVersion) {
            throw "Release version $version does not match project version $projectVersion."
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Build desktop installer
        id: installer
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          .\scripts\build-desktop-installer.ps1 -Version $env:VERSION
          $name = "tastile-desktop-$($env:VERSION)-setup.exe"
          $path = "artifacts\installer\$name"
          if (!(Test-Path $path)) { throw "Installer not found: $path" }
          "installer_name=$name" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Upload installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: desktop-installer
          path: artifacts\installer\${{ steps.installer.outputs.installer_name }}
          if-no-files-found: error

  publish:
    needs: build-installer
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7

      - name: Fetch release secrets from Infisical
        uses: ./.github/actions/infisical-secrets
        with:
          domain: ${{ vars.INFISICAL_DOMAIN }}
          project-id: ${{ vars.INFISICAL_PROJECT_ID_PROD }}
          identity-id: ${{ vars.INFISICAL_IDENTITY_ID_PROD }}
          environment: prod
          path: /tastile/desktop

      - name: Download installer artifact
        uses: actions/download-artifact@v8
        with:
          name: desktop-installer
          path: dist/update

      - name: Materialize immutable release metadata
        env:
          VERSION: ${{ needs.build-installer.outputs.version }}
          NOTES: ${{ github.event.release.body }}
        run: |
          set -euo pipefail
          test -n "$DOWNLOAD_PUBLIC_BASE_URL"
          INSTALLER_PATH="dist/update/tastile-desktop-${VERSION}-setup.exe"
          INSTALLER_SHA256=$(sha256sum "$INSTALLER_PATH" | awk '{print $1}')
          ARTIFACT_KEY="releases/desktop/${VERSION}/tastile-desktop-${VERSION}-setup.exe"
          DOWNLOAD_URL="${DOWNLOAD_PUBLIC_BASE_URL%/}/${ARTIFACT_KEY}"
          jq -n \
            --arg version "$VERSION" \
            --arg download_url "$DOWNLOAD_URL" \
            --arg sha256 "$INSTALLER_SHA256" \
            --arg notes "${NOTES:-Manual deploy}" \
            '{
              latest_version: $version,
              download_url: $download_url,
              sha256: $sha256,
              notes: $notes
            }' > dist/update/manifest.json
          printf '%s\n' "$ARTIFACT_KEY" > dist/update/artifact-key
          printf '%s\n' "$INSTALLER_SHA256" > dist/update/artifact-sha256
          cat dist/update/manifest.json

      - name: Configure Cloudflare R2 endpoint
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          echo "R2_ENDPOINT=https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com" >> "$GITHUB_ENV"
          echo "AWS_DEFAULT_REGION=auto" >> "$GITHUB_ENV"
          echo "AWS_EC2_METADATA_DISABLED=true" >> "$GITHUB_ENV"

      - name: Upload immutable versioned artifact to R2
        run: |
          set -euo pipefail
          VERSION="${{ needs.build-installer.outputs.version }}"
          R2_BUCKET="$CLOUDFLARE_R2_BUCKET"
          PUBLIC_BASE="$DOWNLOAD_PUBLIC_BASE_URL"
          INSTALLER_PATH="dist/update/tastile-desktop-${VERSION}-setup.exe"
          ARTIFACT_KEY=$(cat dist/update/artifact-key)
          CONTENT_DISPOSITION="attachment; filename=\"$(basename "$INSTALLER_PATH")\""
          test -n "$CLOUDFLARE_R2_ACCESS_KEY_ID" -a -n "$CLOUDFLARE_R2_SECRET_ACCESS_KEY"
          case "$DOWNLOAD_PUBLIC_BASE_URL" in https://*) : ;; *) echo "DOWNLOAD_PUBLIC_BASE_URL must use HTTPS" >&2; exit 2 ;; esac
          export AWS_ACCESS_KEY_ID="$CLOUDFLARE_R2_ACCESS_KEY_ID"
          export AWS_SECRET_ACCESS_KEY="$CLOUDFLARE_R2_SECRET_ACCESS_KEY"
          UPLOAD_ERROR=$(mktemp)
          if aws s3api put-object \
              --bucket "$R2_BUCKET" \
              --key "$ARTIFACT_KEY" \
              --body "$INSTALLER_PATH" \
              --endpoint-url "$R2_ENDPOINT" \
              --if-none-match '*' \
              --content-type application/vnd.microsoft.portable-executable \
              --content-disposition "$CONTENT_DISPOSITION" \
              --cache-control 'public,max-age=31536000,immutable' \
              --no-cli-pager >/dev/null 2>"$UPLOAD_ERROR"; then
            rm -f "$UPLOAD_ERROR"
          else
            if ! grep -Eiq '412|precondition|if-none-match' "$UPLOAD_ERROR"; then
              cat "$UPLOAD_ERROR" >&2
              exit 2
            fi
            EXPECTED_SHA256=$(sha256sum "$INSTALLER_PATH" | awk '{print $1}')
            curl --fail --silent --show-error --location \
              "${DOWNLOAD_PUBLIC_BASE_URL%/}/${ARTIFACT_KEY}" -o /tmp/existing-installer.exe
            ACTUAL_SHA256=$(sha256sum /tmp/existing-installer.exe | awk '{print $1}')
            test "${ACTUAL_SHA256,,}" = "${EXPECTED_SHA256,,}"
            rm -f "$UPLOAD_ERROR"
          fi

      - name: Verify immutable artifact before changing stable pointer
        env:
          VERSION: ${{ needs.build-installer.outputs.version }}
        run: |
          set -euo pipefail
          DOWNLOAD_URL="${DOWNLOAD_PUBLIC_BASE_URL%/}/$(cat dist/update/artifact-key)"
          EXPECTED_SHA256=$(cat dist/update/artifact-sha256)
          curl --fail --silent --show-error --location "$DOWNLOAD_URL" -o /tmp/public-installer.exe
          ACTUAL_SHA256=$(sha256sum /tmp/public-installer.exe | awk '{print $1}')
          test "${ACTUAL_SHA256,,}" = "${EXPECTED_SHA256,,}"

      - name: Publish stable manifests last
        env:
          VERSION: ${{ needs.build-installer.outputs.version }}
        run: |
          set -euo pipefail
          export AWS_ACCESS_KEY_ID="$CLOUDFLARE_R2_ACCESS_KEY_ID"
          export AWS_SECRET_ACCESS_KEY="$CLOUDFLARE_R2_SECRET_ACCESS_KEY"
          for MANIFEST_KEY in channels/stable/desktop.json updates/desktop/manifest.json; do
            aws s3 cp dist/update/manifest.json "s3://${CLOUDFLARE_R2_BUCKET}/${MANIFEST_KEY}" \
              --endpoint-url "$R2_ENDPOINT" \
              --content-type application/json \
              --cache-control 'public,max-age=60,must-revalidate' \
              --only-show-errors
          done

      - name: Verify public stable manifest
        env:
          VERSION: ${{ needs.build-installer.outputs.version }}
        run: |
          set -euo pipefail
          for MANIFEST_PATH in channels/stable/desktop.json updates/desktop/manifest.json; do
            PUBLIC_MANIFEST=$(curl --fail --silent --show-error --location "${DOWNLOAD_PUBLIC_BASE_URL%/}/${MANIFEST_PATH}")
            echo "$PUBLIC_MANIFEST"
            ACTUAL_VERSION=$(jq -r '.latest_version // empty' <<< "$PUBLIC_MANIFEST")
            DOWNLOAD_URL=$(jq -r '.download_url // empty' <<< "$PUBLIC_MANIFEST")
            EXPECTED_SHA256=$(jq -r '.sha256 // empty' <<< "$PUBLIC_MANIFEST")
            test "$ACTUAL_VERSION" = "$VERSION"
            test "$DOWNLOAD_URL" = "${DOWNLOAD_PUBLIC_BASE_URL%/}/$(cat dist/update/artifact-key)"
            test "${EXPECTED_SHA256,,}" = "$(cat dist/update/artifact-sha256)"
          done

      - name: Upload installer to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.build-installer.outputs.version }}
          TAG_NAME: v${{ needs.build-installer.outputs.version }}
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" "dist/update/tastile-desktop-${VERSION}-setup.exe" --clobber
          else
            gh release create "$TAG_NAME" \
              "dist/update/tastile-desktop-${VERSION}-setup.exe" \
              --title "$TAG_NAME" --generate-notes --target "$GITHUB_SHA"
          fi

      - name: Verify GitHub Release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.build-installer.outputs.version }}
          TAG_NAME: v${{ needs.build-installer.outputs.version }}
        run: |
          set -euo pipefail
          DOWNLOAD_DIR=$(mktemp -d)
          gh release download "$TAG_NAME" \
            --pattern "tastile-desktop-${VERSION}-setup.exe" \
            --dir "$DOWNLOAD_DIR" \
            --clobber
          DOWNLOADED="$DOWNLOAD_DIR/tastile-desktop-${VERSION}-setup.exe"
          test -s "$DOWNLOADED"
          EXPECTED_SHA256=$(cat dist/update/artifact-sha256)
          ACTUAL_SHA256=$(sha256sum "$DOWNLOADED" | awk '{print $1}')
          test "${ACTUAL_SHA256,,}" = "${EXPECTED_SHA256,,}"
