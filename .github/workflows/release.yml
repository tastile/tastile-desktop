name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 0.3.10.0)"
        required: true
        type: string

permissions:
  id-token: write
  contents: write

jobs:
  build-installer:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      installer_name: ${{ steps.installer.outputs.installer_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Resolve version
        id: version
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if ($env:EVENT_NAME -eq "workflow_dispatch") {
            $version = $env:INPUT_VERSION.TrimStart("v")
          } else {
            $version = $env:REF_NAME.TrimStart("v")
          }
          if ($version -notmatch '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$') {
            throw "Release version must contain exactly four ASCII numeric components."
          }
          foreach ($component in $version.Split(".")) {
            $parsedComponent = 0
            if ((![int]::TryParse($component, [ref]$parsedComponent)) -or $parsedComponent -gt 65535) {
              throw "Each release version component must be between 0 and 65535."
            }
          }

          [xml]$project = Get-Content -Raw -Path "src\TastileDesktop\TastileDesktop.csproj"
          $projectVersion = [string]($project.Project.PropertyGroup.Version | Select-Object -First 1)
          if ($version -ne $projectVersion) {
            throw "Release version $version does not match project version $projectVersion."
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Build desktop installer
        id: installer
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          .\scripts\build-desktop-installer.ps1 -Version $env:VERSION
          $name = "tastile-desktop-$($env:VERSION)-setup.exe"
          $path = "artifacts\installer\$name"
          if (!(Test-Path $path)) { throw "Installer not found: $path" }
          "installer_name=$name" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-installer
          path: artifacts\installer\${{ steps.installer.outputs.installer_name }}
          if-no-files-found: error

  publish:
    needs: build-installer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download installer artifact
        uses: actions/download-artifact@v4
        with:
          name: desktop-installer
          path: dist/update

      - name: Materialize manifest.json
        env:
          VERSION: ${{ needs.build-installer.outputs.version }}
          PUBLIC_BASE: ${{ secrets.DOWNLOAD_PUBLIC_BASE_URL }}
          NOTES: ${{ github.event.release.body }}
        run: |
          INSTALLER_PATH="dist/update/tastile-desktop-${VERSION}-setup.exe"
          INSTALLER_SHA256=$(sha256sum "$INSTALLER_PATH" | awk '{print $1}')
          DOWNLOAD_URL="${PUBLIC_BASE%/}/updates/desktop/tastile-desktop-${VERSION}-setup.exe"
          jq -n \
            --arg version "$VERSION" \
            --arg download_url "$DOWNLOAD_URL" \
            --arg sha256 "$INSTALLER_SHA256" \
            --arg notes "${NOTES:-Manual deploy}" \
            '{
              latest_version: $version,
              download_url: $download_url,
              sha256: $sha256,
              notes: $notes
            }' > dist/update/manifest.json
          cat dist/update/manifest.json

      - name: Assume AWS role via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.OIDC_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Upload installer + manifest to transfer bucket
        id: upload
        env:
          TRANSFER_BUCKET: ${{ secrets.TRANSFER_BUCKET }}
          VERSION: ${{ needs.build-installer.outputs.version }}
        run: |
          aws s3 cp "dist/update/tastile-desktop-${VERSION}-setup.exe" \
                   "s3://${TRANSFER_BUCKET}/desktop-builds/${VERSION}/tastile-desktop-${VERSION}-setup.exe"
          aws s3 cp "dist/update/manifest.json" \
                   "s3://${TRANSFER_BUCKET}/desktop-builds/${VERSION}/manifest.json"
          PRESIGNED_EXE=$(aws s3 presign "s3://${TRANSFER_BUCKET}/desktop-builds/${VERSION}/tastile-desktop-${VERSION}-setup.exe" --expires-in 900)
          PRESIGNED_MANIFEST=$(aws s3 presign "s3://${TRANSFER_BUCKET}/desktop-builds/${VERSION}/manifest.json" --expires-in 900)
          echo "presigned_exe=${PRESIGNED_EXE}" >> "$GITHUB_OUTPUT"
          echo "presigned_manifest=${PRESIGNED_MANIFEST}" >> "$GITHUB_OUTPUT"

      - name: Publish via SSM to web host (nginx serves download.tastile.app)
        env:
          WEB_INSTANCE_ID: ${{ secrets.WEB_INSTANCE_ID }}
          VERSION: ${{ needs.build-installer.outputs.version }}
          PRESIGNED_EXE: ${{ steps.upload.outputs.presigned_exe }}
          PRESIGNED_MANIFEST: ${{ steps.upload.outputs.presigned_manifest }}
        run: |
          PARAMETERS=$(jq -n \
            --arg version "$VERSION" \
            --arg exe "$PRESIGNED_EXE" \
            --arg manifest "$PRESIGNED_MANIFEST" \
            '{
              commands: [
                "set -euo pipefail",
                ("VERSION=" + $version),
                "DOWNLOAD_ROOT=/var/www/tastile-downloads/updates/desktop",
                "sudo mkdir -p \"$DOWNLOAD_ROOT\"",
                ("curl -fsSL " + ($exe | @sh) + " -o \"/tmp/tastile-desktop-$VERSION-setup.exe\""),
                ("curl -fsSL " + ($manifest | @sh) + " -o /tmp/manifest.json"),
                "sudo install -m 0644 \"/tmp/tastile-desktop-$VERSION-setup.exe\" \"$DOWNLOAD_ROOT/tastile-desktop-$VERSION-setup.exe\"",
                "sudo install -m 0644 /tmp/manifest.json \"$DOWNLOAD_ROOT/manifest.json\"",
                "sudo nginx -t",
                "sudo systemctl reload nginx",
                "curl -fsS -H Host:download.tastile.app http://127.0.0.1/updates/desktop/manifest.json"
              ]
            }')
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$WEB_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "$PARAMETERS" \
            --output text --query "Command.CommandId")
          echo "SSM command: ${COMMAND_ID}"
          set +e
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$WEB_INSTANCE_ID"
          WAIT_STATUS=$?
          set -e
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$WEB_INSTANCE_ID" \
            --query '{Status:Status,ResponseCode:ResponseCode,StandardOutputContent:StandardOutputContent,StandardErrorContent:StandardErrorContent}' \
            --output json
          exit "$WAIT_STATUS"

      - name: Verify public update manifest
        env:
          VERSION: ${{ needs.build-installer.outputs.version }}
        run: |
          PUBLIC_MANIFEST=$(curl -fsS https://download.tastile.app/updates/desktop/manifest.json)
          echo "$PUBLIC_MANIFEST"
          ACTUAL_VERSION=$(jq -r '.latest_version // .latest // empty' <<< "$PUBLIC_MANIFEST")
          DOWNLOAD_URL=$(jq -r '.download_url // empty' <<< "$PUBLIC_MANIFEST")
          EXPECTED_SHA256=$(jq -r '.sha256 // empty' <<< "$PUBLIC_MANIFEST")
          if [ "$ACTUAL_VERSION" != "$VERSION" ]; then
            echo "::error::Public desktop update manifest is ${ACTUAL_VERSION}, expected ${VERSION}"
            exit 1
          fi
          if ! [[ "$DOWNLOAD_URL" =~ ^https:// ]]; then
            echo "::error::Public desktop update manifest download_url must use HTTPS"
            exit 1
          fi
          if ! [[ "$EXPECTED_SHA256" =~ ^[0-9A-Fa-f]{64}$ ]]; then
            echo "::error::Public desktop update manifest sha256 must be 64 hexadecimal characters"
            exit 1
          fi

          LOCAL_INSTALLER="dist/update/tastile-desktop-${VERSION}-setup.exe"
          LOCAL_SHA256=$(sha256sum "$LOCAL_INSTALLER" | awk '{print $1}')
          if [ "${EXPECTED_SHA256,,}" != "${LOCAL_SHA256,,}" ]; then
            echo "::error::Public update manifest SHA-256 does not match the local release installer"
            exit 1
          fi

          PUBLIC_INSTALLER=$(mktemp)
          trap 'rm -f "$PUBLIC_INSTALLER"' EXIT
          curl -fsSL "$DOWNLOAD_URL" -o "$PUBLIC_INSTALLER"
          ACTUAL_SHA256=$(sha256sum "$PUBLIC_INSTALLER" | awk '{print $1}')
          if [ "${ACTUAL_SHA256,,}" != "${LOCAL_SHA256,,}" ]; then
            echo "::error::Public installer SHA-256 does not match the local release installer"
            exit 1
          fi

      - name: Upload installer to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.build-installer.outputs.version }}
          TAG_NAME: v${{ needs.build-installer.outputs.version }}
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" "dist/update/tastile-desktop-${VERSION}-setup.exe" --clobber
          else
            gh release create "$TAG_NAME" \
              "dist/update/tastile-desktop-${VERSION}-setup.exe" \
              --title "$TAG_NAME" --generate-notes
          fi
